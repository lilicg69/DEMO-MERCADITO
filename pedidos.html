<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5f3b">
<title>Haz tu pedido</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f6f3ec;color:#2b2619;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
header{background:#1f5f3b;color:#fff;padding:16px 16px 14px}
header .shop{font-size:22px;font-weight:800;line-height:1.15}
header .sub{margin-top:4px;font-size:14px;color:#e4f1e8}
main{padding:12px 12px 130px;max-width:560px;margin:0 auto}
.note{background:#fff1bf;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.35;font-weight:600;color:#14301f;margin-bottom:12px}
.card{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.pn{display:flex;align-items:center;gap:10px}
.pn .em{font-size:30px;line-height:1;white-space:nowrap}
.pn .nm{flex:1;font-weight:800;font-size:16px;line-height:1.2}
.pn .nm small{display:block;font-weight:600;color:#6b6453;font-size:13px}
.ln{display:flex;align-items:center;gap:8px;padding:9px 0 0;margin-top:9px;border-top:1px solid #eee}
.ln .lb{flex:1;font-size:15px;font-weight:700}
.ln .lb small{display:block;font-weight:600;color:#1f5f3b;font-size:14px}
.qc{display:flex;align-items:center;gap:6px}
.qc button{width:42px;height:42px;border-radius:50%;border:2px solid #1f5f3b;background:#fff;color:#1f5f3b;font-size:22px;font-weight:800;line-height:1}
.qc b{min-width:26px;text-align:center;font-size:18px}
label{display:block;font-weight:800;font-size:14px;margin:12px 0 5px;color:#14301f}
label:first-child{margin-top:0}
input,select{width:100%;border:2px solid #cfc8b6;border-radius:10px;padding:12px;font-size:17px;background:#fff}
input:focus,select:focus{outline:none;border-color:#1f5f3b}
#bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #d9d2c1;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px}
#bar .bt{flex:1;line-height:1.1}
#bar .bt small{display:block;color:#666;font-size:13px}
#bar .bt b{font-size:24px}
#send{border:0;border-radius:12px;padding:14px 18px;font-weight:800;font-size:17px;background:#1f5f3b;color:#fff}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:15px;display:none;max-width:90%;text-align:center}
.ph{font-size:15px;margin-bottom:6px;color:#3b3629}
.bad{padding:30px 18px;text-align:center;font-size:18px;line-height:1.4;font-weight:700}
</style>
</head>
<body>
<header><div class="shop" id="shop">Haz tu pedido</div><div class="sub" id="sub"></div></header>
<main id="main"></main>
<div id="bar" style="display:none"><div class="bt"><small>Total estimado</small><b id="tot">$0</b></div><button id="send">Pedir por WhatsApp</button></div>
<div id="toast"></div>
<script>
(function(){
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(n){ n = Math.round((Number(n) || 0) * 100) / 100; return '$' + n.toLocaleString('es-MX', {minimumFractionDigits: Number.isInteger(n) ? 0 : 2, maximumFractionDigits: 2}); }
function toast(m){ var t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function(){ t.style.display = 'none'; }, 2600); }

function decode(h){
  try {
    var b = h.replace(/^#/, '').replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    var o = JSON.parse(decodeURIComponent(escape(atob(b))));
    if (!o || o.v !== 1 || !/^52\d{10}$/.test(String(o.w)) || !Array.isArray(o.p) || !o.p.length || o.p.length > 300) return null;
    var P = [];
    o.p.forEach(function(r){
      if (!Array.isArray(r)) return;
      var stock = Math.max(0, parseInt(r[3], 10) || 0);
      if (!stock) return;
      var opts = Array.isArray(r[4]) ? r[4].slice(0, 30).map(function(x){ return {n: String(x[0]), x: Number(x[1]) || 0}; }) : [];
      P.push({name: String(r[0]), emoji: String(r[1] || ''), price: Number(r[2]) || 0, stock: stock, opts: opts});
    });
    if (!P.length) return null;
    return {n: String(o.n || 'Mi puesto'), w: String(o.w), m: (Array.isArray(o.m) ? o.m : (o.m ? [o.m] : [])).slice(0, 10).map(function(x){ return String(x).slice(0, 60); }), t: Number(o.t) || 0, p: P};
  } catch (e) { return null; }
}

var D = decode(location.hash), Q = {};
function lines(p){
  if (!p.opts.length) return [{o: '', label: '', price: p.price}];
  var L = [{o: '', label: 'Sencillo', price: p.price}];
  p.opts.forEach(function(x){ L.push({o: x.n, label: 'Con ' + x.n.toLowerCase(), price: p.price + x.x}); });
  return L;
}
function qty(i, o){ return Q[i + '|' + o] || 0; }
function used(i){ var s = 0; lines(D.p[i]).forEach(function(l){ s += qty(i, l.o); }); return s; }
function total(){
  var t = 0;
  D.p.forEach(function(p, i){ lines(p).forEach(function(l){ t += qty(i, l.o) * l.price; }); });
  return t;
}
function list(){
  return D.p.map(function(p, i){
    var ls = lines(p).map(function(l){
      var k = i + '|' + l.o;
      return '<div class="ln"><div class="lb">' + esc(l.label) + '<small>' + money(l.price) + '</small></div>' +
        '<div class="qc"><button type="button" data-d="-1" data-i="' + i + '" data-o="' + esc(l.o) + '" aria-label="Quitar uno">−</button><b>' + qty(i, l.o) + '</b>' +
        '<button type="button" data-d="1" data-i="' + i + '" data-o="' + esc(l.o) + '" aria-label="Agregar uno">+</button></div></div>';
    }).join('');
    var single = p.opts.length === 0;
    return '<div class="card"><div class="pn"><div class="em">' + esc(p.emoji) + '</div><div class="nm">' + esc(p.name) + '<small>Hay ' + p.stock + '</small></div></div>' +
      (single ? ls.replace('<div class="ln">', '<div class="ln" style="border-top:0;margin-top:2px;padding-top:0">') : ls) + '</div>';
  }).join('');
}
function draw(){ $('#list').innerHTML = list(); $('#tot').textContent = money(total()); }

function msg(name, day){
  var mk = D.m.length > 1 ? $('#mk').value : (D.m[0] || '');
  var L = ['Hola, soy ' + name + '. Quiero apartar este pedido para recogerlo el ' + day + (mk ? ' en ' + mk : '') + ':', ''];
  D.p.forEach(function(p, i){
    lines(p).forEach(function(l){
      var q = qty(i, l.o);
      if (q) L.push('• ' + q + ' x ' + p.name + (l.o ? ' + ' + l.o : '') + ' = ' + money(q * l.price));
    });
  });
  L.push('', 'Total estimado: ' + money(total()), 'Pago en efectivo al recoger. Pedido sujeto a disponibilidad.');
  return L.join('\n');
}
function fmtW(w){ var d = w.slice(2); return d.slice(0, 3) + ' ' + d.slice(3, 6) + ' ' + d.slice(6, 8) + ' ' + d.slice(8); }

if (!D) {
  $('#main').innerHTML = '<div class="bad">Este enlace no es válido o ya no tiene productos. Pídele a tu locatario el enlace nuevo.</div>';
} else {
  $('#shop').textContent = D.n;
  var f = D.t ? new Date(D.t) : null;
  $('#sub').textContent = 'WhatsApp ' + fmtW(D.w) + (f ? ' · Catálogo del ' + String(f.getDate()).padStart(2, '0') + '/' + String(f.getMonth() + 1).padStart(2, '0') + ' ' + String(f.getHours()).padStart(2, '0') + ':' + String(f.getMinutes()).padStart(2, '0') : '');
  $('#main').innerHTML = '<div class="note">Elige lo que quieres. Pagas en efectivo cuando lo recoges. El pedido queda sujeto a disponibilidad.</div><div id="list"></div>' +
    '<div class="card"><label for="nm">Tu nombre</label><input id="nm" autocomplete="name" maxlength="60">' +
    (D.m.length > 1 ? '<label for="mk">¿En qué mercadito lo recoges?</label><select id="mk">' + D.m.map(function(x){ return '<option>' + esc(x) + '</option>'; }).join('') + '</select>' : (D.m.length ? '<div class="ph">Lo recoges en: <b>' + esc(D.m[0]) + '</b></div>' : '')) +
    '<label for="dy">¿Qué día lo recoges?</label><input id="dy" maxlength="40" placeholder="Ejemplo: sábado"></div>';
  $('#bar').style.display = 'flex';
  draw();
  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-d]');
    if (!b) return;
    var i = +b.dataset.i, o = b.dataset.o, k = i + '|' + o, d = +b.dataset.d, p = D.p[i];
    if (d > 0) {
      if (used(i) >= p.stock) { toast('Máximo ' + p.stock + ' por ahora'); return; }
      Q[k] = qty(i, o) + 1;
    } else if (qty(i, o) > 0) { Q[k] = qty(i, o) - 1; }
    draw();
  });
  $('#send').addEventListener('click', function(){
    var name = $('#nm').value.trim(), day = $('#dy').value.trim();
    if (total() <= 0) { toast('Elige al menos un producto'); return; }
    if (!name) { toast('Escribe tu nombre'); $('#nm').focus(); return; }
    if (!day) { toast('Escribe qué día lo recoges'); $('#dy').focus(); return; }
    var u = 'https://wa.me/' + D.w + '?text=' + encodeURIComponent(msg(name, day));
    window.__lastWa = u;
    location.href = u;
  });
}
})();
</script>
</body>
</html>
